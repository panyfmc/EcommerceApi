services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SenhaForte1!
    ports:
      - "1433:1433"

    healthcheck:
        test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "SenhaForte1!", "-Q", "SELECT 1", "-C"]
        interval: 10s
        timeout: 3s
        retries: 5

  ecommerce-api:
    image: ecommerce-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=EcommerceDb;User Id=sa;Password=SenhaForte1!;TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy
      